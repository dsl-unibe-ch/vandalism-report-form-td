<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vandalismus-Meldung</title>
<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --border: #d8d7d2;
    --text: #1a1a18;
    --muted: #6d6c66;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --ok: #1a7f4b;
    --warn: #9a3412;
    --radius: 12px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #141413;
      --surface: #1e1e1c;
      --border: #35342f;
      --text: #ededea;
      --muted: #9a9890;
      --accent: #4c8dff;
      --accent-text: #0b0b0a;
      --ok: #4ade80;
      --warn: #fb923c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --surface: #1e1e1c;
    --border: #35342f;
    --text: #ededea;
    --muted: #9a9890;
    --accent: #4c8dff;
    --accent-text: #0b0b0a;
    --ok: #4ade80;
    --warn: #fb923c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin-inline: auto;
    overflow-x: hidden;
  }

  h1 { font-size: 1.25rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }

  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted);
          text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }

  .hidden { display: none !important; }

  .notice {
    padding: 14px 16px; margin-bottom: 18px;
    border: 1px solid var(--accent); border-radius: var(--radius);
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    font-size: 0.9rem;
  }
  .notice a { color: var(--accent); }

  input[type="text"], input[type="date"], select {
    width: 100%; padding: 12px 14px; font: inherit;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    appearance: none;
  }
  select:focus-visible,
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .field { margin-bottom: 18px; }

  .slots { display: grid; gap: 10px; margin: 24px 0; }
  .slot {
    display: flex; align-items: center; gap: 14px;
    padding: 10px; min-height: 84px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    cursor: pointer;
  }
  .slot.filled { border-color: var(--ok); }
  .thumb {
    width: 64px; height: 64px; flex: 0 0 64px; border-radius: 8px;
    background: var(--bg) center/cover no-repeat;
    border: 1px dashed var(--border);
    display: grid; place-items: center;
    color: var(--muted); font-size: 1.6rem; line-height: 1;
  }
  .slot.filled .thumb { border-style: solid; border-color: transparent; }
  .slot-meta { min-width: 0; }
  .slot-name { font-weight: 600; }
  .slot-sub { font-size: 0.8rem; color: var(--muted);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot input[type="file"] { display: none; }

  button {
    width: 100%; padding: 15px; font: inherit; font-weight: 600;
    border: 1px solid transparent; border-radius: var(--radius);
    cursor: pointer;
  }
  .primary { background: var(--accent); color: var(--accent-text); }
  .primary:disabled { opacity: 0.4; cursor: default; }
  .ghost { background: transparent; color: var(--muted); border-color: var(--border);
           margin-top: 10px; font-weight: 500; }

  .note { margin-top: 16px; font-size: 0.82rem; color: var(--muted); min-height: 1.4em; }
  .note.warn { color: var(--warn); }

  .banner {
    display: none;
    padding: 14px 16px; margin-bottom: 20px;
    border: 1px solid var(--warn); border-radius: var(--radius);
    background: color-mix(in srgb, var(--warn) 10%, var(--surface));
    color: var(--text); font-size: 0.9rem;
  }
  .banner.show { display: block; }
  .banner b { color: var(--warn); }
</style>
</head>
<body>

<h1>Vandalismus-Meldung</h1>
<p class="sub">Zeitraum, Adresse, Art der Beschädigung und drei Bilder &rarr; direkt an Outlook.</p>

<div class="banner" id="banner"></div>

<div class="field">
  <label for="dateFrom">Datum von</label>
  <input type="date" id="dateFrom">
</div>

<div class="field">
  <label for="dateTo">Datum bis</label>
  <input type="date" id="dateTo">
</div>

<div class="field">
  <label for="location">Adresse und genaue Bezeichnung</label>
  <input type="text" id="location" placeholder="z.&nbsp;B. Bern, Marktgasse 12, Rückwand Velounterstand" autocomplete="off">
</div>

<div class="field">
  <label for="kind">Art der Beschädigung</label>
  <select id="kind">
    <option value="" disabled selected>Bitte wählen</option>
    <option value="graffiti">Graffiti</option>
    <option value="sachbeschaedigung">Sachbeschädigung</option>
    <option value="diebstahl">Diebstahl</option>
    <option value="frei">Freie Auswahl</option>
  </select>
</div>

<div class="field hidden" id="f-area">
  <label for="area">m2</label>
  <input type="text" id="area" placeholder="z.&nbsp;B. 4.5" autocomplete="off" inputmode="decimal">
</div>

<div class="field hidden" id="f-kindFree">
  <label for="kindFree">Art der Sachbeschädigung</label>
  <input type="text" id="kindFree" placeholder="z.&nbsp;B. Glasbruch, Lampe demoliert" autocomplete="off">
</div>

<div class="field hidden" id="f-kindOwn">
  <label for="kindOwn">Art der Beschädigung (eigene Angabe)</label>
  <input type="text" id="kindOwn" placeholder="kurze Beschreibung" autocomplete="off">
</div>

<div class="field hidden" id="f-amount">
  <label for="amount">Schadenssumme (CHF)</label>
  <input type="text" id="amount" placeholder="z.&nbsp;B. 1200" autocomplete="off" inputmode="decimal">
</div>

<div class="notice hidden" id="theftNotice">
  <b>Diebstahl</b><br>
  Bitte Details zu Vorfall via Mail an
  <a href="mailto:vandalismus.bt@unibe.ch">vandalismus.bt@unibe.ch</a>
</div>

<div class="slots" id="slots"></div>

<button class="primary" id="send" disabled>Senden</button>
<button class="ghost" id="reset">Zurücksetzen</button>

<p class="note" id="note"></p>

<script>
/* ---------- config ---------- */

const SLOTS = [
  { key: "nah",    label: "Nah",    filename: "nah.jpg"    },
  { key: "fern",   label: "Fern",   filename: "fern.jpg"   },
  { key: "detail", label: "Detail", filename: "detail.jpg" },
];

const MAX_EDGE = 2000;    // longest side in px after downscale
const QUALITY  = 0.85;    // jpeg quality

const KINDS = {
  graffiti:          { label: "Graffiti",          fields: ["area", "amount"] },
  sachbeschaedigung: { label: "Sachbeschädigung", fields: ["kindFree", "amount"] },
  diebstahl:         { label: "Diebstahl",         fields: [], notice: true },
  frei:              { label: "Freie Auswahl",     fields: ["kindOwn", "amount"] },
};

const subjectTemplate = ({ dateFrom, dateTo, location, kindLabel }) =>
  `Vandalismus-Meldung ${dateFrom}–${dateTo} – ${location} (${kindLabel})`;

const bodyTemplate = (v) => {
  const lines = [
    `Datum von: ${v.dateFrom}`,
    `Datum bis: ${v.dateTo}`,
    `Adresse und genaue Bezeichnung: ${v.location}`,
    `Art der Beschädigung: ${v.kindLabel}`,
  ];
  if (v.area)     lines.push(`m2: ${v.area}`);
  if (v.kindFree) lines.push(`Art der Sachbeschädigung: ${v.kindFree}`);
  if (v.kindOwn)  lines.push(`Beschreibung: ${v.kindOwn}`);
  if (v.amount)   lines.push(`Schadenssumme (CHF): ${v.amount}`);
  lines.push("", "Anhang: nah.jpg, fern.jpg, detail.jpg", "");
  return lines.join("\n");
};

/* ---------- state ---------- */

const photos = Object.create(null);   // key -> File
const urls   = Object.create(null);   // key -> objectURL

const $ = (id) => document.getElementById(id);
const fromEl = $("dateFrom"), toEl = $("dateTo"), locEl = $("location"),
      kindEl = $("kind"), areaEl = $("area"), kindFreeEl = $("kindFree"),
      kindOwnEl = $("kindOwn"), amountEl = $("amount"),
      sendEl = $("send"), resetEl = $("reset"), noteEl = $("note");

const EXTRA = { area: areaEl, kindFree: kindFreeEl, kindOwn: kindOwnEl, amount: amountEl };

/* ---------- build slot UI ---------- */

$("slots").innerHTML = SLOTS.map(s => `
  <label class="slot" id="slot-${s.key}">
    <span class="thumb" id="thumb-${s.key}">+</span>
    <span class="slot-meta">
      <span class="slot-name">${s.label}</span><br>
      <span class="slot-sub" id="sub-${s.key}">${s.filename}</span>
    </span>
    <input type="file" accept="image/*" id="input-${s.key}">
  </label>
`).join("");

for (const s of SLOTS) {
  $("input-" + s.key).addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handlePick(s, f);
    e.target.value = "";          // allow re-picking the same file
  });
}

/* ---------- image processing ---------- */

async function toJpeg(file, filename) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);

  let blob;
  if (typeof OffscreenCanvas === "function") {
    const c = new OffscreenCanvas(w, h);
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    blob = await c.convertToBlob({ type: "image/jpeg", quality: QUALITY });
  } else {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    blob = await new Promise(r => c.toBlob(r, "image/jpeg", QUALITY));
  }
  bmp.close?.();

  // re-encoding through canvas also drops EXIF (incl. GPS)
  return new File([blob], filename, { type: "image/jpeg", lastModified: Date.now() });
}

async function handlePick(slot, raw) {
  note("");
  $("sub-" + slot.key).textContent = "wird verarbeitet…";
  try {
    const file = await toJpeg(raw, slot.filename);
    photos[slot.key] = file;

    if (urls[slot.key]) URL.revokeObjectURL(urls[slot.key]);
    urls[slot.key] = URL.createObjectURL(file);

    $("thumb-" + slot.key).style.backgroundImage = `url("${urls[slot.key]}")`;
    $("thumb-" + slot.key).textContent = "";
    $("slot-" + slot.key).classList.add("filled");
    $("sub-" + slot.key).textContent =
      `${slot.filename} · ${(file.size / 1024 / 1024).toFixed(1)} MB`;
  } catch (err) {
    $("sub-" + slot.key).textContent = slot.filename;
    note("Bild konnte nicht gelesen werden: " + err.message, true);
  }
  refresh();
}

/* ---------- form ---------- */

function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function values() {
  const kind = kindEl.value;
  const cfg = KINDS[kind];
  const v = {
    kind,
    kindLabel: cfg ? cfg.label : "",
    dateFrom: fmtDate(fromEl.value),
    dateTo: fmtDate(toEl.value),
    location: locEl.value.trim(),
  };
  for (const name of (cfg ? cfg.fields : []))
    v[name] = EXTRA[name].value.trim();
  return v;
}

// show only the fields that belong to the selected kind
function applyKind() {
  const cfg = KINDS[kindEl.value];
  const shown = cfg ? cfg.fields : [];
  for (const name of Object.keys(EXTRA))
    $("f-" + name).classList.toggle("hidden", !shown.includes(name));
  $("theftNotice").classList.toggle("hidden", !(cfg && cfg.notice));
  refresh();
}

function ready() {
  const cfg = KINDS[kindEl.value];
  if (!cfg) return false;
  // Schadenssumme darf leer bleiben, der Rest nicht
  const missing = cfg.fields.some(n => n !== "amount" && !EXTRA[n].value.trim());
  return fromEl.value && toEl.value && locEl.value.trim() && !missing &&
         SLOTS.every(s => photos[s.key]);
}

function refresh() { sendEl.disabled = !ready(); }

function note(msg, warn) {
  noteEl.textContent = msg;
  noteEl.classList.toggle("warn", !!warn);
}

fromEl.addEventListener("input", refresh);
toEl.addEventListener("input", refresh);
kindEl.addEventListener("change", applyKind);
for (const el of Object.values(EXTRA)) el.addEventListener("input", refresh);
locEl.addEventListener("input", () => {
  try { localStorage.setItem("vandalismus.location", locEl.value); } catch (e) {}
  refresh();
});

// defaults
const today = new Date().toLocaleDateString("sv-SE");    // yyyy-mm-dd, local tz
fromEl.value = today;
toEl.value   = today;
try { locEl.value = localStorage.getItem("vandalismus.location") || ""; } catch (e) {}
applyKind();

/* ---------- send ---------- */

sendEl.addEventListener("click", async () => {
  if (!ready()) return;
  const v = values();
  const files = SLOTS.map(s => photos[s.key]);
  const data = { files, title: subjectTemplate(v), text: bodyTemplate(v) };

  let reason;
  if (!window.isSecureContext) {
    reason = "kein sicherer Kontext (" + location.protocol + ")";
  } else if (typeof navigator.canShare !== "function") {
    reason = "navigator.canShare fehlt";
  } else if (!navigator.canShare({ files })) {
    reason = "canShare({files}) = false";
  } else {
    try {
      await navigator.share(data);
      note("Geteilt.");
      return;
    } catch (err) {
      if (err.name === "AbortError") { note(""); return; }
      reason = "share() " + err.name + ": " + err.message;
    }
  }
  fallback(v, files, reason);
});

// download the three files, then open a prefilled mail without attachments
function fallback(v, files, reason) {
  for (const f of files) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  }
  const q = "subject=" + encodeURIComponent(subjectTemplate(v)) +
            "&body="   + encodeURIComponent(bodyTemplate(v));
  note("Fallback (" + reason + "): Bilder liegen in „Downloads“ – im Mail manuell anhängen.", true);
  setTimeout(() => { location.href = "mailto:?" + q; }, 800);
}

/* ---------- reset ---------- */

resetEl.addEventListener("click", () => {
  for (const s of SLOTS) {
    delete photos[s.key];
    if (urls[s.key]) { URL.revokeObjectURL(urls[s.key]); delete urls[s.key]; }
    $("thumb-" + s.key).style.backgroundImage = "";
    $("thumb-" + s.key).textContent = "+";
    $("slot-" + s.key).classList.remove("filled");
    $("sub-" + s.key).textContent = s.filename;
  }
  for (const el of Object.values(EXTRA)) el.value = "";
  kindEl.selectedIndex = 0;
  applyKind();
  note("");
});

/* ---------- environment check ---------- */

// Probe with a dummy JPEG: same check the send button will make later.
function fileSharingAvailable() {
  try {
    if (!window.isSecureContext) return false;
    if (typeof navigator.canShare !== "function") return false;
    const probe = new File([new Blob(["x"], { type: "image/jpeg" })],
                           "probe.jpg", { type: "image/jpeg" });
    return navigator.canShare({ files: [probe] });
  } catch (e) {
    return false;
  }
}

if (!fileSharingAvailable()) {
  const b = $("banner");
  b.innerHTML = !window.isSecureContext
    ? '<b>Seite nicht über HTTPS geladen.</b> Anhänge können nicht direkt ' +
      'übergeben werden – die Bilder landen in „Downloads“ und müssen von Hand ' +
      'angehängt werden.'
    : '<b>Dieser Browser kann keine Anhänge weitergeben.</b> Diese Seite bitte ' +
      'in <b>Chrome</b> öffnen. Sonst landen die Bilder nur in „Downloads“ und ' +
      'müssen von Hand ans Mail angehängt werden.';
  b.classList.add("show");
}
</script>
</body>
</html>
